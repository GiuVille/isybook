# Lettura notturna delle fonti delle promozioni: le candidate finiscono in "Da approvare", nulla viene pubblicato.
# Secret richiesti (Settings → Secrets and variables → Actions):
#   PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, AI_BASE_URL, AI_MODEL e, se il fornitore la chiede, AI_API_KEY.
# Finché mancano il job si chiude senza errori.
name: Promozioni

on:
  schedule:
    - cron: '0 4 * * *' # 05:00 in Italia con l'ora solare (06:00 con l'ora legale)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promotions
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
      AI_MODEL: ${{ secrets.AI_MODEL }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
    steps:
      - name: Controlla la configurazione
        id: config
        run: |
          if [ -z "$PUBLIC_SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$AI_BASE_URL" ] || [ -z "$AI_MODEL" ]; then
            echo "Secret mancanti: imposta Supabase e il modulo di estrazione per attivare la lettura notturna." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Installa le dipendenze
        if: steps.config.outputs.ready == 'true'
        run: npm ci

      - name: Leggi le fonti
        if: steps.config.outputs.ready == 'true'
        run: npm run promotions
