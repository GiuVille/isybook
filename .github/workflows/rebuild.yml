# Aggiornamento del sito su Cloudflare Pages.
# Ogni 15 minuti controlla se i contenuti sono cambiati (e fermi da qualche minuto) o se la redazione ha chiesto
# una build; ogni mattina, dopo la lettura notturna, ricostruisce comunque per le sezioni che dipendono dalla data.
# Secret richiesti: CLOUDFLARE_DEPLOY_HOOK, PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY. Finché mancano il job si chiude senza errori.
name: Aggiornamento del sito

on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '30 4 * * *' # build del mattino: 05:30 in Italia con l'ora solare
  workflow_dispatch:
    inputs:
      force:
        description: Ricostruisci anche senza modifiche
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
      PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Controlla la configurazione
        id: config
        run: |
          if [ -z "$CLOUDFLARE_DEPLOY_HOOK" ]; then
            echo "Secret CLOUDFLARE_DEPLOY_HOOK mancante: il sito non è ancora collegato a Cloudflare Pages." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Installa le dipendenze
        if: steps.config.outputs.ready == 'true'
        run: npm ci

      - name: Ricostruisci se serve
        if: steps.config.outputs.ready == 'true'
        run: |
          if [ "${{ github.event.schedule }}" = "30 4 * * *" ] || [ "${{ inputs.force }}" = "true" ]; then
            npm run rebuild -- --force
          else
            npm run rebuild
          fi
