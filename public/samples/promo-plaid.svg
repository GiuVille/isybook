<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <!-- Grafica di esempio (finta), stile post Instagram di un editore -->
  <defs>
    <pattern id="tartan" width="160" height="160" patternUnits="userSpaceOnUse">
      <rect width="160" height="160" fill="#9c2f3f"/>
      <rect x="0" y="60" width="160" height="40" fill="#6d1f2c" opacity=".8"/>
      <rect x="60" y="0" width="40" height="160" fill="#6d1f2c" opacity=".8"/>
      <rect x="0" y="76" width="160" height="8" fill="#e9c46a" opacity=".7"/>
      <rect x="76" y="0" width="8" height="160" fill="#e9c46a" opacity=".7"/>
      <rect x="0" y="20" width="160" height="4" fill="#fff" opacity=".25"/>
      <rect x="20" y="0" width="4" height="160" fill="#fff" opacity=".25"/>
    </pattern>
  </defs>
  <rect width="1080" height="1080" fill="url(#tartan)"/>
  <rect x="120" y="300" width="840" height="480" rx="28" fill="#fff8e7"/>
  <text x="540" y="430" font-family="Georgia, serif" font-size="78" text-anchor="middle" fill="#6d1f2c">Il plaid d'autunno</text>
  <text x="540" y="530" font-family="Georgia, serif" font-size="44" text-anchor="middle" fill="#3a2a2e">in regalo con 3 romantasy</text>
  <text x="540" y="640" font-family="Georgia, serif" font-size="34" text-anchor="middle" fill="#9c2f3f">fino al 30 novembre · nelle librerie aderenti</text>
  <text x="540" y="1020" font-family="Georgia, serif" font-size="30" text-anchor="middle" fill="#fff" opacity=".85">Grafica di esempio</text>
</svg>
