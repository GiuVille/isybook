<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600">
  <!-- Grafica di esempio (finta), stile banner del sito di un editore -->
  <rect width="1600" height="600" fill="#1f2a33"/>
  <g fill="#c8902a" opacity=".9">
    <rect x="980" y="150" width="120" height="330" rx="8"/>
    <rect x="1120" y="120" width="130" height="360" rx="8" fill="#e0b04a"/>
    <rect x="1270" y="170" width="110" height="310" rx="8" fill="#9b6a1c"/>
  </g>
  <rect x="940" y="480" width="480" height="18" fill="#3b4a56"/>
  <text x="120" y="270" font-family="Georgia, serif" font-size="150" fill="#e9c46a">3x2</text>
  <text x="120" y="360" font-family="Georgia, serif" font-size="56" fill="#f3ead6">sui gialli e i thriller</text>
  <text x="120" y="430" font-family="Georgia, serif" font-size="34" fill="#b9c3cc">il terzo libro è in regalo · fino al 31 ottobre</text>
  <text x="120" y="560" font-family="Georgia, serif" font-size="26" fill="#b9c3cc" opacity=".8">Grafica di esempio</text>
</svg>
